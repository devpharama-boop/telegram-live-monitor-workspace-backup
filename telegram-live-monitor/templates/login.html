<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login — Live Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .login-box {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .login-box h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .login-box p {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-bottom: 30px;
        }
        .login-box input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 3px;
        }
        .login-box input:focus {
            border-color: rgba(0,255,136,0.4);
            box-shadow: 0 0 20px rgba(0,255,136,0.08);
        }
        .login-box input::placeholder {
            color: rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,255,136,0.2);
        }
        .login-box .error {
            color: #ff4757;
            font-size: 13px;
            margin-top: 12px;
            padding: 10px;
            background: rgba(255,71,87,0.1);
            border-radius: 8px;
        }
        .login-box .hint {
            color: rgba(255,255,255,0.25);
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon">🔐</div>
        <h1>Live Stream Monitor</h1>
        <p>Enter password to access dashboard</p>
        <form method="POST">
            <input type="password" name="password" placeholder="Enter password" autofocus required>
            <button type="submit">🔓 Unlock</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>
        <div class="hint">Protected — unauthorized access prohibited</div>
    </div>
</body>
</html>
